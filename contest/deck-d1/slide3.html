<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="deck" content="d1">
<title>DearBloom 03 — 서비스 컨셉</title>
<link rel="stylesheet" href="deck.css">
<style>
  .s3-hl { font-size: 50px; }
  .s3-one {
    margin-top: 18px;
    font-family: var(--sans);
    font-size: 19.5px;
    line-height: 1.6;
    color: var(--ink-2);
  }
  .s3-one b { font-weight: 700; color: var(--ink); }

  /* 대제목·리드 아래 남는 높이를 전부 폰 높이로 쓴다 */
  .s3-phones { margin-top: 22px; --sh: 636px; gap: 20px; }
</style>
</head>
<body>
<div class="slide">
  <div class="creases"></div>

  <div class="botwash soft" style="width:430px;height:660px;left:-124px;top:-96px;">
    <img src="assets/lisianthus.jpg" alt="">
  </div>
  <div class="botwash soft" style="width:420px;height:640px;right:-116px;bottom:-176px;">
    <img src="assets/ranunculus.jpg" alt="">
  </div>

  <div class="blob" style="width:320px;height:260px;left:-90px;top:120px;"></div>
  <div class="blob" style="width:290px;height:240px;right:-90px;bottom:120px;opacity:.7;"></div>

  <div class="stage">

    <div class="tag" style="margin-bottom:14px;">서비스 컨셉</div>

    <h1 class="hl s3-hl">
      관계와 마음을 들려주면,<br>
      DearBloom이 <span class="em-gold">어울리는 꽃</span>을 추천하고 그 이유를 설명합니다
    </h1>

    <p class="s3-one">
      DearBloom은 관계와 상황, 취향과 추억, 안전 조건까지 읽고 검증된 꽃 데이터에서 성격이 다른 꽃 세 가지(안심·의미·대담)와 고른 이유를 함께 내놓습니다.
      <b>아래 네 화면은 지금 바로 눌러 볼 수 있는 프로토타입입니다.</b>
    </p>

    <!-- 실화면 4대 전신 : 마음 → 이야기 → 결과 3안 → 이유와 문장 -->
    <div class="fphones s3-phones">

      <div class="fphone">
        <div class="fdev">
          <div class="fscr">
            <span class="slit"></span>
            <img src="assets/m-question-heart.png" alt="전하고 싶은 마음을 고르는 화면">
          </div>
          <span class="hbar"></span>
        </div>
        <div class="plab"><span class="n">01</span>마음부터 고릅니다</div>
      </div>

      <div class="fphone">
        <div class="fdev">
          <div class="fscr">
            <span class="slit"></span>
            <img src="assets/m-question-traits.png" alt="상대의 이야기를 자유롭게 적는 화면">
          </div>
          <span class="hbar"></span>
        </div>
        <div class="plab"><span class="n">02</span>그 사람 이야기 그대로</div>
      </div>

      <div class="fphone">
        <div class="fdev">
          <div class="fscr">
            <span class="slit"></span>
            <img src="assets/m-results.png" alt="서로 다른 결의 꽃 세 가지가 보이는 결과 화면">
          </div>
          <span class="hbar"></span>
        </div>
        <div class="plab"><span class="n">03</span>서로 다른 결의 꽃 세 가지</div>
      </div>

      <div class="fphone">
        <div class="fdev">
          <div class="fscr">
            <span class="slit"></span>
            <img src="assets/m-why.png" alt="추천 이유와 함께 전할 문장이 보이는 화면">
          </div>
          <span class="hbar"></span>
        </div>
        <div class="plab"><span class="n">04</span>고른 이유와 전할 문장</div>
      </div>

    </div>

  </div>

  <div class="foot-label">서비스 컨셉</div>
  <div class="foot-num">03/05</div>
</div>
</body>
</html>
