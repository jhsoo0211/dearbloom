<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DearBloom 인스타 카드 2 / 7 — 문제</title>
<link rel="stylesheet" href="insta.css">
<style>
  .c2 .bg { background-image: url('assets/bg-2-silhouette.jpg'); }
  .c2 h2 { font-size: 62px; }
</style>
</head>
<body>
<div class="card c2 textured">
  <div class="bg faint"></div>
  <div class="scrim"></div>

  <div class="inner">
    <div class="over">문제</div>

    <h2 class="mt-40">한 번의 꽃 선물에,<br><span class="gold">최소 다섯 번의 검색</span>이<br>필요합니다</h2>

    <p class="lead mt-40" style="font-size:34px">결국 한 번의 선물을 위해 다음 과정을 반복합니다.</p>

    <div class="chain">
      <div class="chain-row"><span class="chain-n">01</span><span class="chain-bar"></span><span class="chain-t">꽃 추천 검색</span></div>
      <div class="chain-row"><span class="chain-n">02</span><span class="chain-bar"></span><span class="chain-t">꽃말 재검색</span></div>
      <div class="chain-row"><span class="chain-n">03</span><span class="chain-bar"></span><span class="chain-t">색상별 의미 확인</span></div>
      <div class="chain-row"><span class="chain-n">04</span><span class="chain-bar"></span><span class="chain-t">반려동물 안전 확인</span></div>
      <div class="chain-row"><span class="chain-n">05</span><span class="chain-bar"></span><span class="chain-t">카드 문구 검색</span></div>
      <div class="chain-row last"><span class="chain-n">06</span><span class="chain-bar"></span><span class="chain-t">실제 꽃집·구매처 검색</span></div>
    </div>

    <div class="spacer"></div>

    <div class="box">
      <div class="l1">문제는 꽃 정보가 없는 것이 아닙니다.</div>
      <div class="l2">내 마음에 이 꽃이 정말 맞는지<br>판단할 기준이 없는 것입니다.</div>
    </div>
  </div>

  <div class="idx"><b>02</b> / 07</div>
</div>
</body>
</html>
