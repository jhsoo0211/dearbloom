<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DearBloom 인스타 카드 3 / 7 — 서비스 소개</title>
<link rel="stylesheet" href="insta.css">
<style>
  /* 해결 카드는 사진 없이 잉크 + 골드 글로우로 전환감을 준다 */
  .c3 .scrim::before {
    background: radial-gradient(110% 62% at 50% -6%,
        rgba(27, 44, 33, .55) 0%, rgba(216, 169, 78, .06) 40%, rgba(10, 9, 8, 0) 72%),
      linear-gradient(180deg, rgba(10, 9, 8, .30) 0%, rgba(10, 9, 8, .92) 100%);
  }
  .c3 h2 { font-size: 60px; }
</style>
</head>
<body>
<div class="card c3">
  <div class="scrim"></div>

  <div class="inner">
    <div class="over">해결</div>

    <h2 class="mt-40">관계와 마음을 말하면,<br><span class="gold">DearBloom</span>이 꽃과 이유를<br>함께 고릅니다</h2>

    <p class="lead mt-40" style="font-size:35px">관계·상황·취향·추억·안전 조건을 이해해,<br>검증된 꽃 데이터에서 <b>성격이 다른 꽃 3안과<br>선택 이유</b>를 추천합니다.</p>

    <div class="spacer"></div>

    <div class="trio-h">결과 3안</div>
    <div class="trio">
      <div class="opt hero">
        <span class="tag">안심</span>
        <span class="d">관계와 상황에 가장 무난한 꽃</span>
      </div>
      <div class="opt">
        <span class="tag">의미</span>
        <span class="d">꽃말과 이야기가 가장 잘 맞는 꽃</span>
      </div>
      <div class="opt">
        <span class="tag">대담</span>
        <span class="d">상대의 취향과 추억을<br>더 강하게 반영한 꽃</span>
      </div>
    </div>
    <div style="height:34px"></div>
  </div>

  <div class="idx"><b>03</b> / 07</div>
</div>
</body>
</html>
