<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DearBloom 인스타 카드 4 / 7 — 실제 화면 01</title>
<link rel="stylesheet" href="insta.css">
<style>
  .c4 .bg { background-image: url('assets/bg-4-fern.jpg'); }
  .c4 h2 { font-size: 62px; }
</style>
</head>
<body>
<div class="card c4 textured">
  <div class="bg faint"></div>
  <div class="scrim"></div>

  <div class="inner">
    <div class="over">실제 화면 01</div>
    <h2 class="mt-40">꽃 이름만<br><span class="gold">보여주지 않습니다</span></h2>
    <p class="lead mt-28" style="font-size:35px">어떤 입력과 이야기 때문에 골랐는지 설명합니다.</p>
  </div>

  <div class="phone">
    <img src="assets/m-results.png" alt="DearBloom 추천 결과 화면">
  </div>
  <div class="phone-fade"></div>

  <!-- top 값은 화면 캡처 안에서 가릴 것이 없는 구간에 맞춘 값이다.
       폰 top 500 · 스케일 520/780 = .6667 → 카드y = 500 + .6667 * 원본y -->
  <div class="callout" style="left: 24px; top: 822px;">
    <span class="dot"></span>관계와 마음부터 선택
  </div>
  <div class="callout dark" style="right: 24px; top: 1080px;">
    왜 이 꽃인지 설명
  </div>

  <div class="idx"><b>04</b> / 07</div>
</div>
</body>
</html>
