<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dearbloom — 질문 (보태니컬 에디토리얼)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://hangeul.pstatic.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
@font-face { font-family: 'MaruBuri'; font-weight: 300; font-display: swap;
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Light.woff2') format('woff2'); }
@font-face { font-family: 'MaruBuri'; font-weight: 400; font-display: swap;
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2') format('woff2'); }

:root{
  --ivory:#F6F1E8;
  --ink:#1F211E;
  --stem:#263B2E;
  --rose:#8A3448;
  --lavender:#83779C;
  --gold:#C8963E;
  --ivory-shade:#EBE4D6;
  --gold-deep:#8A682B;
  --ink-mute:rgba(31,33,30,.65);
  --rule:rgba(31,33,30,.25);
  --rule-soft:rgba(31,33,30,.14);
  --font-serif:'MaruBuri','Noto Serif KR','Nanum Myeongjo','AppleMyungjo',Batang,serif;
  --font-sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ivory);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4,p,ol,ul,dl,dd,blockquote{margin:0;padding:0}
ol,ul{list-style:none}
button{font-family:inherit;color:inherit}
img,svg{max-width:100%}
[hidden]{display:none !important}

.page{position:relative;max-width:430px;margin-inline:auto;background:var(--ivory);min-height:100vh;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:768px){
  body{background:var(--ivory-shade)}
  .page{border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
}

a:focus-visible,button:focus-visible{outline:2px solid var(--stem);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── 상단 바 ─────────────────────────── */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--ink);padding:10px 16px 10px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;color:var(--ink);text-decoration:none;font-size:19px;line-height:1;background:none;border:0;cursor:pointer}
.icon-btn:hover{color:var(--stem)}
.logo{display:inline-block;font:400 18px/1.2 var(--font-serif);letter-spacing:.05em;color:var(--ink);text-decoration:none;padding:10px 4px}

/* ── 진행 표시 ───────────────────────── */
.prog{padding:22px 24px 0}
.prog-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.overline{font:600 11px/1.5 var(--font-sans);letter-spacing:.14em;color:var(--ink-mute)}
.overline.gold{color:var(--gold-deep)}
.prog-count{font:400 14px/1.4 var(--font-serif);letter-spacing:.06em;color:var(--ink)}
.prog-track{position:relative;height:1px;background:var(--rule)}
.prog-fill{position:absolute;left:0;top:-1px;height:2px;background:var(--ink);width:20%}

/* ── 질문 ───────────────────────────── */
main{flex:1 0 auto;padding:0 24px 40px}
.q{padding:44px 0 8px}
h1{font:300 32px/1.4 var(--font-serif);letter-spacing:-.01em}
@media (min-width:768px){h1{font-size:38px}}
.q-sub{margin-top:14px;font:400 16px/1.75 var(--font-sans);color:var(--ink-mute)}

/* ── 선택지 리스트 행 ────────────────── */
.opts{margin-top:34px;border-top:1px solid var(--rule)}
.opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:0 14px 0 17px;background:none;border:0;border-bottom:1px solid var(--rule-soft);border-left:3px solid transparent;text-align:left;color:var(--ink);cursor:pointer;transition:background-color .2s ease}
.opt:last-child{border-bottom:1px solid var(--rule)}
.opt .name{font:500 17px/1.5 var(--font-sans)}
.opt .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:0;flex:0 0 7px;transition:opacity .2s ease}
.opt:hover{background:rgba(31,33,30,.03)}
.opt[aria-checked="true"]{background:rgba(38,59,46,.05);border-left-color:var(--stem)}
.opt[aria-checked="true"] .name{color:var(--stem)}
.opt[aria-checked="true"] .dot{opacity:1}

/* ── 하단 액션 ───────────────────────── */
.actions{padding:28px 24px 46px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:0;border-radius:2px;background:var(--stem);color:var(--ivory);font:500 15px/1.2 var(--font-sans);letter-spacing:.02em;text-decoration:none;cursor:pointer;transition:opacity .2s ease}
.btn:hover{opacity:.88}
.micro{margin-top:14px;text-align:center;font:400 12px/1.6 var(--font-sans);color:var(--ink-mute)}

/* ── 장식 ────────────────────────────── */
.sprig{position:absolute;width:118px;height:59px;opacity:.26;pointer-events:none;bottom:118px;right:-20px;transform:rotate(-6deg)}
.sprig .line{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* fill-mode 없음: 애니메이션이 늦게 시작하거나 실행되지 않아도 기본 상태가 항상 보인다 */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fadeIn .6s ease}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<div class="page">

  <header class="bar">
    <a class="icon-btn" href="home.html" aria-label="뒤로 가기">←</a>
    <a class="logo" href="home.html">dearbloom</a>
    <a class="icon-btn" href="home.html" aria-label="닫기">×</a>
  </header>

  <div class="prog">
    <div class="prog-head">
      <p class="overline">QUESTION 1 OF 5</p>
      <p class="prog-count">1 / 5</p>
    </div>
    <div class="prog-track" role="img" aria-label="5문항 중 1번째"><span class="prog-fill"></span></div>
  </div>

  <main class="fade">
    <div class="q">
      <h1>어떤 사이인가요?</h1>
      <p class="q-sub">관계에 따라 같은 꽃말도 다르게 풀어드려요.</p>
    </div>

    <div class="opts" role="radiogroup" aria-label="관계 선택">
      <button type="button" class="opt" role="radio" aria-checked="true" tabindex="0">
        <span class="name">연인</span>
        <span class="dot" aria-hidden="true"></span>
      </button>
      <button type="button" class="opt" role="radio" aria-checked="false" tabindex="-1">
        <span class="name">배우자</span>
        <span class="dot" aria-hidden="true"></span>
      </button>
      <button type="button" class="opt" role="radio" aria-checked="false" tabindex="-1">
        <span class="name">썸</span>
        <span class="dot" aria-hidden="true"></span>
      </button>
      <button type="button" class="opt" role="radio" aria-checked="false" tabindex="-1">
        <span class="name">친구</span>
        <span class="dot" aria-hidden="true"></span>
      </button>
      <button type="button" class="opt" role="radio" aria-checked="false" tabindex="-1">
        <span class="name">가족</span>
        <span class="dot" aria-hidden="true"></span>
      </button>
      <button type="button" class="opt" role="radio" aria-checked="false" tabindex="-1">
        <span class="name">동료·선후배</span>
        <span class="dot" aria-hidden="true"></span>
      </button>
    </div>
  </main>

  <svg class="sprig" viewBox="0 0 120 60" aria-hidden="true" focusable="false"><g class="line"><path d="M4 30 C34 30 68 26 112 14"/><path d="M30 30 C32 20 42 14 54 14 C50 24 40 30 30 30"/><path d="M52 26 C54 16 64 10 76 10 C72 20 62 26 52 26"/><path d="M74 22 C76 12 86 6 98 6 C94 16 84 22 74 22"/><path d="M30 30 C32 40 42 46 54 46 C50 36 40 30 30 30"/><path d="M52 34 C54 44 64 50 76 50 C72 40 62 34 52 34"/></g></svg>

  <div class="actions">
    <a class="btn" href="result.html">다음</a>
    <p class="micro">45초면 충분해요</p>
  </div>

</div>
<script>
(function(){
  var opts = document.querySelectorAll('.opt[role="radio"]');
  function pick(el){
    opts.forEach(function(o){
      var on = (o === el);
      o.setAttribute('aria-checked', on ? 'true' : 'false');
      o.tabIndex = on ? 0 : -1;
    });
  }
  opts.forEach(function(o, i){
    o.addEventListener('click', function(){ pick(o); });
    o.addEventListener('keydown', function(e){
      var n = null;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = (i + 1) % opts.length;
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = (i - 1 + opts.length) % opts.length;
      if (n === null) return;
      e.preventDefault();
      opts[n].focus();
      pick(opts[n]);
    });
  });
})();
</script>
</body>
</html>
