<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141613">
<title>dearbloom — 질문 (앱 v2 · 다크 시네마 글래스)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://hangeul.pstatic.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* ── 마루 부리 (네이버 공식) ───────────────────────────────── */
@font-face{font-family:'MaruBuri';font-weight:200;font-display:swap;
  src:url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-ExtraLight.woff2') format('woff2')}
@font-face{font-family:'MaruBuri';font-weight:300;font-display:swap;
  src:url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Light.woff2') format('woff2')}
@font-face{font-family:'MaruBuri';font-weight:400;font-display:swap;
  src:url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2') format('woff2')}
@font-face{font-family:'MaruBuri';font-weight:600;font-display:swap;
  src:url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-SemiBold.woff2') format('woff2')}

:root{
  --ivory:#F6F1E8; --ink:#1F211E; --stem:#263B2E; --rose:#8A3448; --lavender:#83779C; --gold:#C8963E;
  --bg:#141613; --bg-deep:#0B0C0A;
  --rose-deep:#5C2230; --stem-deep:#1B2C21; --lav-deep:#4A4160; --gold-deep:#8A672B; --lav-dim:#5E5670;
  --rose-lt:#C09398; --lav-lt:#A69CB3; --stem-lt:#989F94;
  --tx-1:#F6F1E8; --tx-2:rgba(246,241,232,.78); --tx-3:rgba(246,241,232,.66);
  --glass-top:rgba(246,241,232,.085); --glass-bot:rgba(246,241,232,.025);
  --glass-solid:rgba(31,33,30,.94);
  --hair:rgba(246,241,232,.13); --hair-soft:rgba(246,241,232,.08);
  --font-serif:'MaruBuri','Noto Serif KR','Nanum Myeongjo','AppleMyungjo',Batang,serif;
  --font-sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1); --dur:220ms;
  --bar-h:58px; --foot-h:112px; --gut:20px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-deep);color:var(--tx-1);
  font-family:var(--font-sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  word-break:keep-all;overflow-wrap:break-word}
svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.phone{position:relative;width:100%;max-width:430px;margin-inline:auto;min-height:100svh;
  background:var(--bg);overflow:hidden;isolation:isolate;
  padding-top:calc(var(--bar-h) + env(safe-area-inset-top));
  padding-bottom:calc(var(--foot-h) + 20px + env(safe-area-inset-bottom))}
@media (min-width:768px){
  body{padding:26px 0;
    background:radial-gradient(90% 46% at 50% 0%,rgba(138,52,72,.16),transparent 68%),
               radial-gradient(70% 40% at 50% 100%,rgba(38,59,46,.14),transparent 70%),var(--bg-deep)}
  .phone{border-radius:40px;min-height:calc(100svh - 52px);
    box-shadow:0 0 0 1px rgba(246,241,232,.10),
      0 2.8px 2.2px rgba(0,0,0,.05),0 6.7px 5.3px rgba(0,0,0,.07),
      0 12.5px 10px rgba(0,0,0,.09),0 22.3px 17.9px rgba(0,0,0,.11),
      0 41.8px 33.4px rgba(0,0,0,.15),0 100px 80px rgba(0,0,0,.36)}
  .appbar{top:26px;width:430px;border-radius:40px 40px 0 0}
  .footbar{bottom:26px;width:430px;border-radius:0 0 40px 40px}
}

.ambient{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(64px);will-change:transform}
.blob-a{width:320px;height:320px;top:-110px;left:-120px;
  background:radial-gradient(circle,rgba(138,52,72,.60),transparent 70%);
  animation:drift-a 28s var(--ease) infinite alternate}
.blob-b{width:300px;height:300px;bottom:40px;right:-130px;
  background:radial-gradient(circle,rgba(38,59,46,.72),transparent 70%);
  animation:drift-b 34s var(--ease) infinite alternate}
@keyframes drift-a{to{transform:translate3d(28px,32px,0) scale(1.12)}}
@keyframes drift-b{to{transform:translate3d(-26px,-30px,0) scale(1.10)}}

.grain{position:fixed;inset:0;width:100vw;height:100vh;opacity:.045;pointer-events:none;z-index:80}

.glass{position:relative;border-radius:20px;
  background:linear-gradient(180deg,var(--glass-top),var(--glass-bot));
  -webkit-backdrop-filter:blur(18px) saturate(130%);backdrop-filter:blur(18px) saturate(130%);
  box-shadow:inset 0 1px 0 rgba(246,241,232,.09),
    0 1px 2px rgba(0,0,0,.32),0 8px 16px -8px rgba(0,0,0,.48)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(150deg,rgba(246,241,232,.26) 0%,rgba(246,241,232,.10) 48%,
    rgba(200,150,62,.16) 78%,rgba(246,241,232,.07) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite:exclude;pointer-events:none}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .glass{background:var(--glass-solid)}
}

/* ── 상단 바 : 뒤로 + 진행바 + 닫기 ─────────────────────── */
.bar{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,430px);z-index:50}
.appbar{top:0;display:flex;align-items:center;gap:12px;
  height:calc(var(--bar-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 10px 0;
  background:linear-gradient(180deg,rgba(20,22,19,.94),rgba(20,22,19,.62));
  -webkit-backdrop-filter:blur(18px) saturate(130%);backdrop-filter:blur(18px) saturate(130%);
  border-bottom:1px solid var(--hair-soft)}
.icon-btn{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;
  color:var(--tx-2);cursor:pointer;
  transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.icon-btn:hover{background:rgba(246,241,232,.08);color:var(--tx-1)}
.icon-btn svg{width:22px;height:22px}
.progress{flex:1;display:flex;align-items:center;gap:10px}
.track{flex:1;height:3px;border-radius:999px;background:rgba(246,241,232,.15);overflow:hidden}
.fill{display:block;height:100%;width:20%;border-radius:999px;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold));
  box-shadow:0 0 12px rgba(200,150,62,.55);
  transition:width 320ms var(--ease)}
.step{font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--gold);font-variant-numeric:tabular-nums}

/* ── 질문 ────────────────────────────────────────────────── */
main{position:relative;z-index:1}
.qhead{padding:34px var(--gut) 0}
.qhead .overline{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);margin-bottom:14px}
.qhead h1{font-family:var(--font-serif);font-weight:300;font-size:30px;line-height:1.4;
  letter-spacing:-.015em;color:var(--tx-1)}
.qhead p{margin-top:12px;font-size:14.5px;line-height:1.7;color:var(--tx-3)}

/* ── 관계 리스트 ─────────────────────────────────────────── */
.rels{display:grid;gap:9px;padding:26px var(--gut) 0}
.rel{position:relative;display:flex;align-items:center;gap:14px;min-height:66px;
  padding:12px 15px;border-radius:18px;cursor:pointer;
  background:linear-gradient(180deg,rgba(246,241,232,.055),rgba(246,241,232,.018));
  -webkit-backdrop-filter:blur(16px) saturate(126%);backdrop-filter:blur(16px) saturate(126%);
  box-shadow:inset 0 1px 0 rgba(246,241,232,.07),0 1px 2px rgba(0,0,0,.3);
  transition:background-color var(--dur) var(--ease),transform 180ms var(--ease)}
.rel::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(150deg,rgba(246,241,232,.20),rgba(246,241,232,.05) 60%,rgba(246,241,232,.10));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite:exclude;pointer-events:none;transition:background var(--dur) var(--ease)}
.rel:hover{background:linear-gradient(180deg,rgba(246,241,232,.09),rgba(246,241,232,.03))}
.rel:active{transform:scale(.985)}
.rel input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.rel-ic{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;
  background:rgba(246,241,232,.055);border:1px solid var(--hair);color:var(--tx-2);
  transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.rel-ic svg{width:20px;height:20px}
.rel-body{flex:1;min-width:0}
.rel-name{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.01em;color:var(--tx-1)}
.rel-desc{display:block;margin-top:2px;font-size:14px;color:var(--tx-3)}
.rel-check{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--hair);color:transparent;
  transition:all var(--dur) var(--ease)}
.rel-check svg{width:15px;height:15px}

/* 선택 상태 : Rose 그라디언트 보더 + 체크 */
.rel.is-on,.rel:has(input:checked){
  background:linear-gradient(180deg,rgba(138,52,72,.28),rgba(92,34,48,.12))}
.rel.is-on::before,.rel:has(input:checked)::before{
  padding:1.5px;
  background:linear-gradient(140deg,rgba(246,241,232,.55) 0%,rgba(138,52,72,.95) 38%,
    rgba(200,150,62,.55) 72%,rgba(246,241,232,.30) 100%)}
.rel.is-on .rel-ic,.rel:has(input:checked) .rel-ic{
  color:var(--rose-lt);border-color:rgba(138,52,72,.6);background:rgba(138,52,72,.22)}
.rel.is-on .rel-check,.rel:has(input:checked) .rel-check{
  color:var(--ink);background:var(--ivory);border-color:var(--ivory);
  box-shadow:0 0 0 4px rgba(246,241,232,.09)}
.rel:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:3px}

/* ── 하단 고정 CTA ──────────────────────────────────────── */
.footbar{bottom:0;padding:14px var(--gut) calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(20,22,19,.30),rgba(20,22,19,.94) 42%,rgba(20,22,19,.99));
  -webkit-backdrop-filter:blur(20px) saturate(130%);backdrop-filter:blur(20px) saturate(130%);
  border-top:1px solid var(--hair-soft)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;
  border-radius:999px;font-size:16px;font-weight:600;letter-spacing:-.01em;cursor:pointer;
  transition:transform 180ms var(--ease),box-shadow var(--dur) var(--ease)}
.btn svg{width:19px;height:19px}
.btn-primary{background:linear-gradient(180deg,#FFFDF8,var(--ivory));color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 6px rgba(0,0,0,.44),
    0 14px 28px -14px rgba(246,241,232,.42)}
.btn-primary:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 8px rgba(0,0,0,.5),
    0 18px 34px -14px rgba(246,241,232,.55)}
.btn-primary:active{transform:scale(.975)}
.micro{margin-top:11px;text-align:center;font-size:12.5px;letter-spacing:.02em;color:var(--tx-3)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>
<body>

<header class="bar appbar">
  <a class="icon-btn" href="home.html" aria-label="이전 화면으로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </a>
  <div class="progress">
    <span class="track" role="progressbar" aria-label="5문항 중 1번째" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-valuetext="1 / 5">
      <span class="fill"></span>
    </span>
    <span class="step">1 / 5</span>
  </div>
  <a class="icon-btn" href="home.html" aria-label="질문 닫기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </a>
</header>

<div class="phone">
  <div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
  </div>

  <main>
    <div class="qhead">
      <p class="overline">Question 1 of 5</p>
      <h1 id="q-title">어떤 사이인가요?</h1>
      <p>관계에 따라 같은 꽃말도 다르게 풀어드려요.</p>
    </div>

    <div class="rels" role="radiogroup" aria-labelledby="q-title">
      <label class="rel is-on">
        <input type="radio" name="relation" value="연인" checked>
        <span class="rel-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2S4.6 15.6 4.6 10.6A4.1 4.1 0 0 1 12 8.1a4.1 4.1 0 0 1 7.4 2.5c0 5-7.4 9.6-7.4 9.6z"/></svg>
        </span>
        <span class="rel-body">
          <span class="rel-name">연인</span>
          <span class="rel-desc">사귀는 사이예요</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>

      <label class="rel">
        <input type="radio" name="relation" value="배우자">
        <span class="rel-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.3" cy="14" r="5"/><circle cx="14.7" cy="10.6" r="5"/></svg>
        </span>
        <span class="rel-body">
          <span class="rel-name">배우자</span>
          <span class="rel-desc">결혼한 사이예요</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>

      <label class="rel">
        <input type="radio" name="relation" value="썸">
        <span class="rel-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l1.9 5.2 5.2 1.9-5.2 1.9-1.9 5.2-1.9-5.2-5.2-1.9 5.2-1.9z"/><path d="M18.6 17.4l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/></svg>
        </span>
        <span class="rel-body">
          <span class="rel-name">썸</span>
          <span class="rel-desc">아직 조심스러운 사이예요</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>

      <label class="rel">
        <input type="radio" name="relation" value="친구">
        <span class="rel-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.6" r="3.1"/><path d="M3.6 19.4c0-3 2.4-5.2 5.4-5.2s5.4 2.2 5.4 5.2"/><path d="M16.2 6.6a3.1 3.1 0 0 1 0 6"/><path d="M17.2 14.5c2.1.6 3.2 2.4 3.2 4.6"/></svg>
        </span>
        <span class="rel-body">
          <span class="rel-name">친구</span>
          <span class="rel-desc">편한 사이예요</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>

      <label class="rel">
        <input type="radio" name="relation" value="가족">
        <span class="rel-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M12 17.9s-2.6-1.7-2.6-3.4a1.55 1.55 0 0 1 2.6-1 1.55 1.55 0 0 1 2.6 1c0 1.7-2.6 3.4-2.6 3.4z"/></svg>
        </span>
        <span class="rel-body">
          <span class="rel-name">가족</span>
          <span class="rel-desc">부모님, 형제자매</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>

      <label class="rel">
        <input type="radio" name="relation" value="동료·선후배">
        <span class="rel-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="7.4" width="17.6" height="12.6" rx="2.4"/><path d="M8.6 7.4V6a2 2 0 0 1 2-2h2.8a2 2 0 0 1 2 2v1.4"/><path d="M3.2 12.6h17.6"/></svg>
        </span>
        <span class="rel-body">
          <span class="rel-name">동료·선후배</span>
          <span class="rel-desc">일과 배움으로 만난 사이</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>
    </div>
  </main>
</div>

<div class="bar footbar">
  <a class="btn btn-primary" href="result.html">
    다음
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M12.5 6l6 6-6 6"/></svg>
  </a>
  <p class="micro">45초면 충분해요</p>
</div>

<svg class="grain" aria-hidden="true" focusable="false">
  <filter id="grainFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#grainFilter)"/>
</svg>

<script>
(function(){
  var rows = Array.prototype.slice.call(document.querySelectorAll('.rel'));
  rows.forEach(function(row){
    row.querySelector('input').addEventListener('change', function(){
      rows.forEach(function(r){ r.classList.toggle('is-on', r === row); });
    });
  });
})();
</script>

</body>
</html>
