<!DOCTYPE html>
<html lang="ko" data-flower="tulip">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0B0C0A">
<meta name="description" content="dearbloom — 어떤 사이인가요?">
<title>dearbloom — 질문 (앱 v3 · 나이트 보태니컬 아카이브)</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://hangeul.pstatic.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   dearbloom — 앱 v3 · 질문 1/5
   랜딩 v3의 오버라인·세리프·헤어라인 문법만으로 구성한 화면.
   실사 없음 — 타이포와 선이 화면을 만든다. 기본 테마(흰 튤립) 고정.
   ═════════════════════════════════════════════════════════════════════ */

@font-face{font-family:'MaruBuri';font-weight:200;font-style:normal;font-display:swap;
  src:url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-ExtraLight.woff2') format('woff2')}
@font-face{font-family:'MaruBuri';font-weight:300;font-style:normal;font-display:swap;
  src:url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Light.woff2') format('woff2')}
@font-face{font-family:'MaruBuri';font-weight:400;font-style:normal;font-display:swap;
  src:url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2') format('woff2')}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{overflow-x:clip}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}

/* ── 팔레트 · 기본 꽃-테마(흰 튤립) ─────────────────────────────────── */
:root{
  --ivory:#F6F1E8; --ink:#1F211E; --stem:#263B2E; --rose:#8A3448; --lavender:#83779C; --gold:#C8963E;
  --ink-950:#0B0C0A; --ink-900:#141613; --stem-900:#1B2C21; --wine:#5C2230;
  --plum:#4A4160; --gold-deep:#8A672B; --lav-tint:#A69CB3;

  --font-sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',
              'Malgun Gothic','Segoe UI',Roboto,sans-serif;
  --font-serif:'MaruBuri','Noto Serif KR','Nanum Myeongjo','AppleMyungjo',Batang,serif;
  --font-logo:'Instrument Serif','MaruBuri',Georgia,'Times New Roman',serif;

  --ease:cubic-bezier(.22,1,.36,1);
  --dur:220ms;
  --bar-h:58px; --foot-h:128px; --gut:20px;

  --bg:#0B0C0A; --bg-2:#141613; --bg-3:#1B2C21;
  --fg:#F6F1E8;
  --fg-70:rgba(246,241,232,.80);
  --fg-50:rgba(246,241,232,.62);
  --hair:rgba(246,241,232,.16); --hair-2:rgba(246,241,232,.30);
  --accent:#C8963E; --accent-line:rgba(200,150,62,.55); --seal:#C8963E;
  --cta-bg:#F6F1E8; --cta-fg:#0B0C0A; --cta-glow:rgba(246,241,232,.30);
  --ghost-line:rgba(246,241,232,.42);
  --focus:#C8963E;
  --surface:rgba(246,241,232,.045); --surface-2:rgba(246,241,232,.075);
  --chrome-a:rgba(11,12,10,.94); --chrome-b:rgba(11,12,10,.66);
  --grain-blend:overlay; --grain-op:.05;
}

body{
  background:var(--bg-2); color:var(--fg);
  font-family:var(--font-sans); font-size:15.5px; line-height:1.7;
  letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  word-break:keep-all; overflow-wrap:break-word;
}

.phone{position:relative;width:100%;max-width:430px;margin-inline:auto;min-height:100svh;
  background:var(--bg);overflow:hidden;isolation:isolate;
  padding-top:calc(var(--bar-h) + env(safe-area-inset-top));
  padding-bottom:calc(var(--foot-h) + 20px + env(safe-area-inset-bottom))}
@media (min-width:768px){
  body{padding:26px 0;background:var(--bg-2)}
  .phone{border-radius:40px;min-height:calc(100svh - 52px);
    box-shadow:0 0 0 1px var(--hair),
      0 2.8px 2.2px rgba(0,0,0,.05),0 6.7px 5.3px rgba(0,0,0,.07),
      0 12.5px 10px rgba(0,0,0,.09),0 22.3px 17.9px rgba(0,0,0,.11),
      0 41.8px 33.4px rgba(0,0,0,.15),0 100px 80px rgba(0,0,0,.36)}
  .appbar{top:26px;width:430px;border-radius:40px 40px 0 0}
  .footbar{bottom:26px;width:430px;border-radius:0 0 40px 40px}
}

.grain{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none;
  opacity:var(--grain-op);mix-blend-mode:var(--grain-blend)}

/* ── 상단 바 : 뒤로 + 진행 + 닫기 ───────────────────────────────────── */
.bar{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,430px);z-index:60}
.appbar{top:0;display:flex;align-items:center;gap:12px;
  height:calc(var(--bar-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 10px 0;
  background:linear-gradient(180deg,var(--chrome-a),var(--chrome-b));
  -webkit-backdrop-filter:blur(18px) saturate(130%);backdrop-filter:blur(18px) saturate(130%);
  border-bottom:1px solid var(--hair)}
.icon-btn{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;
  color:var(--fg-70);transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:22px;height:22px}
.progress{flex:1;display:flex;align-items:center;gap:10px}
.track{flex:1;height:1px;background:var(--hair);overflow:hidden}
.fill{display:block;height:100%;width:20%;background:var(--accent);
  transition:width 320ms var(--ease)}
.step{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--accent);
  font-variant-numeric:tabular-nums}

/* ── 질문 헤드 (랜딩 v3 오버라인 + 세리프) ──────────────────────────── */
main{position:relative;z-index:1}
.overline{display:flex;align-items:center;gap:10px;
  font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.overline .ko{text-transform:none;letter-spacing:.03em;font-weight:400;font-size:12px;color:var(--fg-50)}
.overline::after{content:"";flex:1;height:1px;background:var(--accent-line)}

.qhead{padding:38px var(--gut) 0}
.qhead .overline{margin-bottom:22px}
.qhead h1{font-family:var(--font-serif);font-weight:300;font-size:33px;line-height:1.36;
  letter-spacing:-.025em;color:var(--fg)}
.qhead .lede{margin-top:14px;font-size:14.5px;line-height:1.75;color:var(--fg-70)}

/* ── 관계 6종 — 헤어라인 리스트 ─────────────────────────────────────── */
.rels{margin:30px 0 0;padding:0 var(--gut)}
.rel{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;gap:16px;min-height:72px;padding:15px 4px 15px 0;
  border-top:1px solid var(--hair);cursor:pointer;
  transition:background-color var(--dur) var(--ease)}
.rels .rel:last-of-type{border-bottom:1px solid var(--hair)}
.rel:hover{background:var(--surface)}
.rel input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.rel-no{font-family:var(--font-serif);font-weight:200;font-size:22px;line-height:1;
  color:var(--fg-50);font-variant-numeric:tabular-nums;
  transition:color var(--dur) var(--ease)}
.rel-body{min-width:0}
.rel-name{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--fg);
  line-height:1.35}
.rel-desc{display:block;margin-top:3px;font-size:13.5px;line-height:1.6;color:var(--fg-50)}
.rel-check{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--hair-2);color:transparent;
  transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),
    color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.rel-check svg{width:14px;height:14px}

/* 선택 상태 — 골드 헤어라인 + 아이보리 체크 (글래스 대신 선과 색으로) */
.rel.is-on{background:var(--surface)}
.rel.is-on::before{content:"";position:absolute;left:calc(var(--gut) * -1);top:-1px;bottom:-1px;
  width:2px;background:var(--accent)}
.rel.is-on .rel-no{color:var(--accent)}
.rel.is-on .rel-check{color:var(--cta-fg);background:var(--cta-bg);border-color:var(--cta-bg);
  box-shadow:0 0 0 4px rgba(246,241,232,.10)}
.rel:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}

.qnote{margin:22px var(--gut) 0;padding-top:18px;border-top:1px solid var(--hair);
  font-size:13px;line-height:1.72;color:var(--fg-50)}
.qnote .seal{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--seal);
  margin-right:8px;vertical-align:1px}

/* ── 하단 고정 CTA ──────────────────────────────────────────────────── */
.footbar{bottom:0;padding:16px var(--gut) calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(11,12,10,.35),var(--chrome-a) 46%,rgba(11,12,10,.99));
  -webkit-backdrop-filter:blur(20px) saturate(130%);backdrop-filter:blur(20px) saturate(130%);
  border-top:1px solid var(--hair)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;
  padding:0 22px;border-radius:9999px;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1;
  transition:transform 180ms var(--ease),box-shadow var(--dur) var(--ease)}
.btn svg{width:19px;height:19px}
.btn-primary{background:var(--cta-bg);color:var(--cta-fg)}
.btn-primary:hover{box-shadow:0 12px 30px -10px var(--cta-glow)}
.btn-primary:active{transform:scale(.975)}
.micro{margin-top:12px;text-align:center;font-size:12.5px;letter-spacing:.02em;color:var(--fg-50)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>
<body>

<header class="bar appbar">
  <a class="icon-btn" href="home.html" aria-label="이전 화면으로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </a>
  <div class="progress">
    <span class="track" role="progressbar" aria-label="5문항 중 1번째" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-valuetext="1 / 5">
      <span class="fill"></span>
    </span>
    <span class="step">1 / 5</span>
  </div>
  <a class="icon-btn" href="home.html" aria-label="질문 닫기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </a>
</header>

<div class="phone">
  <main>
    <div class="qhead">
      <p class="overline">Question 01 <span class="ko">5문항 중 1번째</span></p>
      <h1 id="q-title">어떤 사이인가요?</h1>
      <p class="lede">관계에 따라 같은 꽃말도 다르게 풀어드려요.</p>
    </div>

    <div class="rels" role="radiogroup" aria-labelledby="q-title">
      <label class="rel is-on">
        <input type="radio" name="relation" value="연인" checked>
        <span class="rel-no" aria-hidden="true">01</span>
        <span class="rel-body">
          <span class="rel-name">연인</span>
          <span class="rel-desc">사귀는 사이예요</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>

      <label class="rel">
        <input type="radio" name="relation" value="배우자">
        <span class="rel-no" aria-hidden="true">02</span>
        <span class="rel-body">
          <span class="rel-name">배우자</span>
          <span class="rel-desc">결혼한 사이예요</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>

      <label class="rel">
        <input type="radio" name="relation" value="썸">
        <span class="rel-no" aria-hidden="true">03</span>
        <span class="rel-body">
          <span class="rel-name">썸</span>
          <span class="rel-desc">아직 조심스러운 사이예요</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>

      <label class="rel">
        <input type="radio" name="relation" value="친구">
        <span class="rel-no" aria-hidden="true">04</span>
        <span class="rel-body">
          <span class="rel-name">친구</span>
          <span class="rel-desc">편한 사이예요</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>

      <label class="rel">
        <input type="radio" name="relation" value="가족">
        <span class="rel-no" aria-hidden="true">05</span>
        <span class="rel-body">
          <span class="rel-name">가족</span>
          <span class="rel-desc">부모님, 형제자매</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>

      <label class="rel">
        <input type="radio" name="relation" value="동료·선후배">
        <span class="rel-no" aria-hidden="true">06</span>
        <span class="rel-body">
          <span class="rel-name">동료·선후배</span>
          <span class="rel-desc">일과 배움으로 만난 사이</span>
        </span>
        <span class="rel-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.2 4.2L19 7.2"/></svg>
        </span>
      </label>
    </div>

    <p class="qnote"><span class="seal" aria-hidden="true"></span>꽃말은 문화와 시대에 따라 달라요. 출처와 함께 보여드려요.</p>
  </main>
</div>

<div class="bar footbar">
  <a class="btn btn-primary" href="result.html">
    다음
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M12.5 6l6 6-6 6"/></svg>
  </a>
  <p class="micro">45초면 충분해요</p>
</div>

<svg class="grain" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <filter id="db-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#db-grain)"/>
</svg>

<script>
(function(){
  var rows = [].slice.call(document.querySelectorAll('.rel'));
  rows.forEach(function(row){
    row.querySelector('input').addEventListener('change', function(){
      rows.forEach(function(r){ r.classList.toggle('is-on', r === row); });
    });
  });
})();
</script>

</body>
</html>
