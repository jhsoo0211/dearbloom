<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dearbloom — 질문 (페탈 갤러리)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://hangeul.pstatic.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
@font-face { font-family: 'MaruBuri'; font-weight: 200; font-display: swap;
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-ExtraLight.woff2') format('woff2'); }
@font-face { font-family: 'MaruBuri'; font-weight: 300; font-display: swap;
  src: url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Light.woff2') format('woff2'); }

:root{
  --ivory:#F6F1E8;
  --ink:#1F211E;
  --stem:#263B2E;
  --rose:#8A3448;
  --lavender:#83779C;
  --gold:#C8963E;
  /* 팔레트 파생 셰이드/틴트만 사용 */
  --dark:#141613;
  --wine:#5C2230;
  --forest:#1B2C21;
  --violet:#4A4160;
  --rose-lt:#C59BA0;
  --stem-lt:#838D82;
  --txt:rgba(246,241,232,.72);
  --txt-dim:rgba(246,241,232,.62);
  --line:rgba(246,241,232,.15);
  --font-serif:'MaruBuri','Noto Serif KR','Nanum Myeongjo','AppleMyungjo',Batang,serif;
  --font-sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',
              'Malgun Gothic','Segoe UI',Roboto,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#0B0C0A;color:var(--ivory);font-family:var(--font-sans);
  font-size:15px;line-height:1.7;font-weight:400;overflow-x:hidden;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,li,dl,dt,dd{margin:0;padding:0}
ul,ol{list-style:none}
svg{display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.shell{position:relative;max-width:430px;margin-inline:auto;background:var(--dark);
  min-height:100vh;overflow:hidden;padding-bottom:200px}
@media (min-width:768px){
  body{background:#080907}
  .shell{box-shadow:0 0 0 1px rgba(246,241,232,.07),0 24px 90px rgba(0,0,0,.65)}
}
.wrap{padding-left:24px;padding-right:24px}

/* ── 상단바 ───────────────────────────── */
.topbar{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;
  height:60px;padding:0 14px}
.logo{font-family:var(--font-serif);font-weight:300;font-size:19px;letter-spacing:.02em;
  display:inline-flex;align-items:center;min-height:44px;padding:0 8px;color:rgba(246,241,232,.9)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
  color:rgba(246,241,232,.8);font-size:18px;line-height:1}

/* ── 배경 매크로 레이어(은은하게) ─────── */
.bgstage{position:absolute;top:0;left:0;right:0;height:56vh;overflow:hidden;z-index:0;pointer-events:none;
  background:
    radial-gradient(110% 80% at 78% 6%, rgba(92,34,48,.85) 0%, rgba(92,34,48,0) 62%),
    radial-gradient(90% 70% at 8% 26%, rgba(38,59,46,.7) 0%, rgba(38,59,46,0) 58%),
    radial-gradient(70% 60% at 90% 46%, rgba(131,119,156,.28) 0%, rgba(131,119,156,0) 62%);
  --p1:rgba(92,34,48,.9);--p2:rgba(138,52,72,.6);--p3:rgba(131,119,156,.4);}
.petals{position:absolute;top:-18%;left:-18%;width:136%;height:136%;
  filter:blur(40px);opacity:.5;pointer-events:none}
.petals--b{opacity:.32}
.petals--a{animation:driftA 30s ease-in-out infinite alternate}
.petals--b{animation:driftB 30s ease-in-out infinite alternate}
@keyframes driftA{from{transform:translate3d(-2%,-1%,0) scale(1)}
                  to{transform:translate3d(3%,2.5%,0) scale(1.09)}}
@keyframes driftB{from{transform:translate3d(2%,1.5%,0) scale(1.06) rotate(-2deg)}
                  to{transform:translate3d(-3%,-2%,0) scale(1) rotate(2.5deg)}}
.grain{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.bgstage .scrim{position:absolute;left:0;right:0;bottom:0;height:70%;
  background:linear-gradient(180deg, rgba(20,22,19,0) 0%, rgba(20,22,19,.9) 72%, #141613 100%)}
.page{position:relative;z-index:2}

/* ── 진행 ─────────────────────────────── */
.prog{padding-top:16px}
.prog-num{font-family:var(--font-serif);font-weight:200;font-size:38px;line-height:1.1;
  letter-spacing:.02em;color:rgba(246,241,232,.45)}
.prog-num strong{font-weight:300;color:var(--ivory)}
.prog-bar{position:relative;height:1px;background:var(--line);margin-top:18px}
.prog-bar i{position:absolute;left:0;top:-1px;height:3px;width:20%;background:var(--gold);display:block}
.prog-cap{margin-top:12px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold)}

/* ── 질문 ─────────────────────────────── */
.qhead{padding-top:44px}
.qhead h1{font-family:var(--font-serif);font-weight:200;font-size:36px;line-height:1.35;
  color:var(--ivory);margin-bottom:14px}
.qhead p{font-size:14px;line-height:1.7;color:var(--txt)}

/* ── 대형 타이포 리스트 ───────────────── */
.opts{margin-top:34px}
.opts li{border-top:1px solid var(--line)}
.opts li:last-child{border-bottom:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:18px 2px;
  text-align:left;transition:color .25s ease,padding .25s ease}
.opt-rule{display:block;width:0;height:1px;background:var(--rose-lt);transition:width .25s ease}
.opt-name{font-family:var(--font-serif);font-weight:300;font-size:26px;line-height:1.3;
  color:rgba(246,241,232,.65);transition:color .25s ease}
.opt-go{margin-left:auto;font-size:18px;color:transparent;transition:color .25s ease}
.opt:hover .opt-name{color:var(--ivory)}
.opt[aria-checked="true"] .opt-rule{width:26px}
.opt[aria-checked="true"] .opt-name{color:var(--rose-lt)}
.opt[aria-checked="true"] .opt-go{color:var(--rose-lt)}

/* ── 하단 고정 ────────────────────────── */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;
  z-index:20;padding:34px 24px 22px;
  background:linear-gradient(180deg, rgba(20,22,19,0) 0%, rgba(20,22,19,.92) 34%, #141613 100%)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;
  padding:15px 18px;border:0;border-radius:0;font-family:var(--font-sans);font-size:15px;
  font-weight:500;letter-spacing:.01em;text-align:center;cursor:pointer;
  transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.btn--ghost{background:transparent;border:1px solid rgba(246,241,232,.4);color:var(--ivory)}
.btn--ghost:hover{border-color:rgba(246,241,232,.8);background:rgba(246,241,232,.06)}
.micro{margin-top:12px;text-align:center;font-size:14px;letter-spacing:.02em;color:var(--txt-dim)}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>

<div class="shell">

  <div class="bgstage" aria-hidden="true">
    <svg class="petals petals--a" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice">
      <path style="fill:var(--p1)" d="M232 -30 C324 -66 412 8 406 116 C400 226 300 274 214 244 C130 214 118 24 232 -30 Z"/>
      <path style="fill:var(--p2)" d="M-34 236 C40 184 146 236 154 332 C162 432 74 494 -8 466 C-92 438 -100 286 -34 236 Z"/>
    </svg>
    <svg class="petals petals--b" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice">
      <path style="fill:var(--p3)" d="M256 300 C334 268 406 320 404 396 C402 476 330 520 268 494 C202 466 190 330 256 300 Z"/>
    </svg>
    <svg class="grain"><rect width="100%" height="100%" filter="url(#grain)" opacity="0.05"/></svg>
    <div class="scrim"></div>
  </div>

  <div class="page">

    <header class="topbar">
      <a class="icon-btn" href="home.html" aria-label="이전 화면으로">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true">
          <path d="M17 7H1M1 7l6-6M1 7l6 6" stroke="currentColor" stroke-width="1"/>
        </svg>
      </a>
      <a class="logo" href="home.html">dearbloom</a>
      <a class="icon-btn" href="home.html" aria-label="추천 그만두기">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1"/>
        </svg>
      </a>
    </header>

    <div class="wrap prog">
      <p class="prog-num" aria-hidden="true"><strong>01</strong> / 05</p>
      <div class="prog-bar" role="progressbar" aria-label="5문항 중 1번째"
           aria-valuemin="1" aria-valuemax="5" aria-valuenow="1"><i></i></div>
      <p class="prog-cap">Question 1 of 5</p>
    </div>

    <div class="wrap qhead">
      <h1 id="q1">어떤 사이인가요?</h1>
      <p>관계에 따라 같은 꽃말도 다르게 풀어드려요.</p>
    </div>

    <ul class="wrap opts" role="radiogroup" aria-labelledby="q1">
      <li>
        <button type="button" class="opt" role="radio" aria-checked="true">
          <span class="opt-rule" aria-hidden="true"></span>
          <span class="opt-name">연인</span>
          <span class="opt-go" aria-hidden="true">→</span>
        </button>
      </li>
      <li>
        <button type="button" class="opt" role="radio" aria-checked="false">
          <span class="opt-rule" aria-hidden="true"></span>
          <span class="opt-name">배우자</span>
          <span class="opt-go" aria-hidden="true">→</span>
        </button>
      </li>
      <li>
        <button type="button" class="opt" role="radio" aria-checked="false">
          <span class="opt-rule" aria-hidden="true"></span>
          <span class="opt-name">썸</span>
          <span class="opt-go" aria-hidden="true">→</span>
        </button>
      </li>
      <li>
        <button type="button" class="opt" role="radio" aria-checked="false">
          <span class="opt-rule" aria-hidden="true"></span>
          <span class="opt-name">친구</span>
          <span class="opt-go" aria-hidden="true">→</span>
        </button>
      </li>
      <li>
        <button type="button" class="opt" role="radio" aria-checked="false">
          <span class="opt-rule" aria-hidden="true"></span>
          <span class="opt-name">가족</span>
          <span class="opt-go" aria-hidden="true">→</span>
        </button>
      </li>
      <li>
        <button type="button" class="opt" role="radio" aria-checked="false">
          <span class="opt-rule" aria-hidden="true"></span>
          <span class="opt-name">동료·선후배</span>
          <span class="opt-go" aria-hidden="true">→</span>
        </button>
      </li>
    </ul>

  </div>

  <div class="dock">
    <a class="btn btn--ghost" href="result.html">다음</a>
    <p class="micro">45초면 충분해요</p>
  </div>

</div>
</body>
</html>
